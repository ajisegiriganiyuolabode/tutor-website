<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Example digital whiteboard showing an algebra equation solved step by step and a forces diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C62828"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F5BEA"/></marker>
</defs>
<rect width="1200" height="800" rx="28" fill="#E3EAFB"/>
<rect x="30" y="30" width="1140" height="740" rx="18" fill="#FFFFFF" stroke="#C5D0EA" stroke-width="3"/>
<rect x="30" y="30" width="1140" height="64" rx="18" fill="#F6F8FC"/>
<rect x="30" y="76" width="1140" height="18" fill="#F6F8FC"/>
<circle cx="70" cy="62" r="9" fill="#FF6B6B"/><circle cx="100" cy="62" r="9" fill="#FFD67A"/><circle cx="130" cy="62" r="9" fill="#5CC98A"/>
<text x="600" y="70" text-anchor="middle" font-family="Lexend, Arial, sans-serif" font-size="22" font-weight="600" fill="#14213D">Live lesson · Maths &amp; Physics</text>
<line x1="600" y1="120" x2="600" y2="740" stroke="#D6DEF3" stroke-width="3" stroke-dasharray="10 10"/>
<g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" fill="#14213D">
<text x="70" y="160" font-size="34" font-weight="700" fill="#2F5BEA">Algebra (KS3)</text>
<text x="70" y="235" font-size="40">Solve:  3x + 5 = 20</text>
<text x="70" y="330" font-size="36">Step 1:  take 5 from both sides</text>
<text x="110" y="395" font-size="40">3x = 15</text>
<text x="70" y="490" font-size="36">Step 2:  divide both sides by 3</text>
<text x="110" y="555" font-size="44" fill="#C62828" font-weight="700">x = 5</text>
<rect x="95" y="508" width="150" height="68" rx="10" fill="none" stroke="#C62828" stroke-width="4"/>
<text x="70" y="660" font-size="34">Check:  3(5) + 5 = 20  ✓</text>
<text x="640" y="160" font-size="34" font-weight="700" fill="#2F5BEA">Forces (KS3 Physics)</text>
<text x="640" y="215" font-size="28">Is the box moving?</text>
</g>
<rect x="760" y="420" width="240" height="140" rx="6" fill="#FFD67A" stroke="#14213D" stroke-width="4"/>
<line x1="680" y1="560" x2="1100" y2="560" stroke="#14213D" stroke-width="5"/>
<g stroke-width="6" fill="none">
<line x1="880" y1="490" x2="880" y2="300" stroke="#2F5BEA" marker-end="url(#ab)"/>
<line x1="880" y1="490" x2="880" y2="650" stroke="#C62828" marker-end="url(#ah)"/>
<line x1="1000" y1="500" x2="1120" y2="500" stroke="#2F5BEA" marker-end="url(#ab)"/>
<line x1="760" y1="500" x2="660" y2="500" stroke="#C62828" marker-end="url(#ah)"/>
</g>
<g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" font-size="28" fill="#14213D">
<text x="900" y="330">Normal force</text>
<text x="900" y="640">Weight</text>
<text x="1010" y="470">Push</text>
<text x="640" y="470">Friction</text>
<text x="640" y="720" font-size="26" fill="#3B4A6B">Equal forces = balanced = no change</text>
</g>
</svg>
